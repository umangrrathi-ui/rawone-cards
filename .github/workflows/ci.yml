name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # gitleaks needs full history on PRs
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm audit
      - run: npm run build
        env:
          SESSION_SECRET: ci-dummy-0123456789abcdef
          BASE_URL: https://ci.local
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  # Production image + MySQL + Redis exactly as on the VPS, then the 64-check end-to-end suite.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Build image
        run: docker build -t cards:ci .
      - name: Start stack
        run: |
          cp .env.example .env
          for k in SESSION_SECRET DATA_KEY MYSQL_ROOT_PASSWORD MYSQL_PASSWORD REDIS_PASSWORD BACKUP_PASSPHRASE; do
            sed -i "s#^$k=.*#$k=$(openssl rand -hex 24)#" .env
          done
          sed -i 's#^IMAGE=.*#IMAGE=cards:ci#; s#^BASE_URL=.*#BASE_URL=http://127.0.0.1:3100#; s#^ADMIN_EMAILS=.*#ADMIN_EMAILS=admin@example.com#' .env
          printf 'services:\n  app:\n    environment:\n      MAIL_DEV_LOG: "1"\n' > docker-compose.override.yml
          docker compose up -d --wait --wait-timeout 180
          (docker compose logs -f app > app.log 2>&1 &)
          sleep 3
      - name: End-to-end
        run: E2E_BASE=http://127.0.0.1:3100 node scripts/dev/e2e.mjs app.log
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
