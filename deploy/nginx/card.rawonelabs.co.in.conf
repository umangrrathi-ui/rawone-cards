# /etc/nginx/sites-available/card.rawonelabs.co.in  (symlink into sites-enabled)
# Cloudflare (proxied, SSL "Full (strict)") -> this Nginx (Cloudflare Origin Certificate) -> app on 127.0.0.1:3100
# Cloudflare IP ranges for real_ip live in /etc/nginx/conf.d/cloudflare-realip.conf (written by bootstrap-vps.sh).

limit_req_zone $binary_remote_addr zone=cards_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cards_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=cards_conn:10m;

upstream cards_app {
    server 127.0.0.1:3100;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name card.rawonelabs.co.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;            # old syntax on purpose: Ubuntu 22.04/24.04 ship nginx < 1.25
    listen [::]:443 ssl http2;
    server_name card.rawonelabs.co.in;

    ssl_certificate     /etc/ssl/cloudflare/card.rawonelabs.co.in.pem;
    ssl_certificate_key /etc/ssl/cloudflare/card.rawonelabs.co.in.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cards_ssl:10m;
    ssl_session_timeout 1d;

    # Only Cloudflare may talk to this origin (mTLS "Authenticated Origin Pulls").
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;

    server_tokens off;
    client_max_body_size 5m;          # 3 MB photo + base64/JSON overhead; the app enforces the real limit
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    limit_conn cards_conn 30;

    access_log /var/log/nginx/cards.access.log;
    error_log  /var/log/nginx/cards.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/vcard;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # real client IP (set by real_ip from CF-Connecting-IP); overwrite, never append
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 30s;
    proxy_hide_header X-Powered-By;

    # Login / signup / OTP endpoints: tight per-IP brake on top of the app's own limiter.
    location ~ ^/api/(auth|account)/ {
        limit_req zone=cards_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://cards_app;
    }

    location /api/ {
        limit_req zone=cards_api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://cards_app;
    }

    location /_next/static/ {
        proxy_pass http://cards_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Health check stays inside the box.
    location = /api/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://cards_app;
    }

    # Never serve dotfiles or source maps.
    location ~ /\.(?!well-known) { deny all; }
    location ~ \.map$ { deny all; }

    location / {
        proxy_pass http://cards_app;
    }
}
