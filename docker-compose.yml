# RAWONE Cards production stack. Lives in /opt/cards on the VPS next to .env.
# Sits behind the VPS's existing Traefik (the same one that serves n8n, reviewflow ...): Traefik owns 80/443,
# issues the SSL certificate and forwards card.rawone.co.in to the app. MySQL and Redis are never exposed.
# Memory caps (~830 MB total) are sized for a KVM 1 (4 GB) that is already shared with other apps.

name: cards

services:
  app:
    image: ${IMAGE:-ghcr.io/umangrrathi-ui/rawone-cards:latest}
    restart: unless-stopped
    # Explicit whitelist: the app never sees MySQL root, Redis or backup credentials beyond what it needs.
    environment:
      NODE_ENV: production
      BASE_URL: ${BASE_URL:?set in .env}
      TZ_OFFSET_MIN: ${TZ_OFFSET_MIN:-330}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      DATA_KEY: ${DATA_KEY:?set in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DATABASE_URL: mysql://cards:${MYSQL_PASSWORD}@db:3306/cards
      DB_POOL: ${DB_POOL:-8}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      MEDIA_DIR: /app/data/media
      PWNED_API: ${PWNED_API:-}   # leave empty: breached-password check on; "off" disables it
    ports:
      - "127.0.0.1:3110:3000"          # local health check only
    volumes:
      - media:/app/data/media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [cards, web]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${WEB_NETWORK:-root_default}
      traefik.http.routers.cards.rule: Host(`${CARDS_HOST:-card.rawone.co.in}`)
      traefik.http.routers.cards.entrypoints: web,websecure
      traefik.http.routers.cards.tls: "true"
      traefik.http.routers.cards.tls.certresolver: mytlschallenge
      traefik.http.routers.cards.middlewares: cards-limit,cards-body
      traefik.http.services.cards.loadbalancer.server.port: "3000"
      # Login / signup / OTP: tight per-IP brake on top of the app's own limiter
      traefik.http.routers.cards-auth.rule: Host(`${CARDS_HOST:-card.rawone.co.in}`) && PathPrefix(`/api/auth`)
      traefik.http.routers.cards-auth.priority: "100"
      traefik.http.routers.cards-auth.entrypoints: web,websecure
      traefik.http.routers.cards-auth.tls: "true"
      traefik.http.routers.cards-auth.tls.certresolver: mytlschallenge
      traefik.http.routers.cards-auth.middlewares: cards-auth-limit,cards-body
      traefik.http.routers.cards-auth.service: cards
      traefik.http.middlewares.cards-limit.ratelimit.average: "20"
      traefik.http.middlewares.cards-limit.ratelimit.period: 1s
      traefik.http.middlewares.cards-limit.ratelimit.burst: "60"
      traefik.http.middlewares.cards-auth-limit.ratelimit.average: "12"
      traefik.http.middlewares.cards-auth-limit.ratelimit.period: 1m
      traefik.http.middlewares.cards-auth-limit.ratelimit.burst: "8"
      traefik.http.middlewares.cards-body.buffering.maxRequestBodyBytes: "5242880"
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 384m
    cpus: 1.0
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cards
      MYSQL_USER: cards
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=40
      - --performance-schema=OFF
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql:/var/lib/mysql
    networks: [cards]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set in .env}
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    networks: [cards]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

networks:
  cards:
    driver: bridge
  web:                                   # the network Traefik is on (docker network ls -> root_default)
    external: true
    name: ${WEB_NETWORK:-root_default}

volumes:
  mysql:
  media:
