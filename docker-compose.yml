# RAWONE Cards production stack. Lives in /opt/cards on the VPS next to .env.
# Sized for KVM 1 (4 GB RAM) shared with n8n + the Discord bot: total cap ~1.2 GB.
# Only the app is reachable, and only on 127.0.0.1 — Nginx in front is the single public door.

name: cards

services:
  app:
    image: ${IMAGE:-ghcr.io/umangrrathi-ui/rawone-cards:latest}
    restart: unless-stopped
    # Explicit whitelist: the app never sees MySQL root, Redis or backup credentials beyond what it needs.
    environment:
      NODE_ENV: production
      BASE_URL: ${BASE_URL:?set in .env}
      TZ_OFFSET_MIN: ${TZ_OFFSET_MIN:-330}
      SESSION_SECRET: ${SESSION_SECRET:?set in .env}
      DATA_KEY: ${DATA_KEY:?set in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DATABASE_URL: mysql://cards:${MYSQL_PASSWORD}@db:3306/cards
      DB_POOL: ${DB_POOL:-8}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      MEDIA_DIR: /app/data/media
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - media:/app/data/media
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [cards]
    read_only: true
    tmpfs: ["/tmp", "/app/.next/cache"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 1.0
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cards
      MYSQL_USER: cards
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
    command:
      - --innodb-buffer-pool-size=192M
      - --max-connections=60
      - --performance-schema=OFF
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql:/var/lib/mysql
    networks: [cards]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set in .env}
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    networks: [cards]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    read_only: true
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging: { driver: json-file, options: { max-size: "5m", max-file: "2" } }

networks:
  cards:
    driver: bridge

volumes:
  mysql:
  media:
